<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abriendo App del Conductor…</title>
<style>
  :root{
    --bg:#FFFFFF; --panel:#F6FAF9; --border:#D7E5E2; --text:#0F211D;
    --text-muted:#3E6B62; --accent:#00CDA6; --accent-text:#00A987;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text); font-family:Arial, sans-serif; padding:24px;
  }
  .box{max-width:380px; text-align:center;}
  h1{font-size:18px; margin-bottom:6px;}
  p{font-size:13.5px; color:var(--text-muted); line-height:1.5;}
  a.btn{
    display:inline-block; margin-top:16px; background:var(--accent); color:#062622;
    padding:13px 22px; border-radius:9px; text-decoration:none; font-weight:700; font-size:14px;
  }
  code{
    display:block; word-break:break-all; background:var(--panel); border:1px solid var(--border);
    padding:10px; border-radius:8px; font-size:11px; margin-top:8px; color:var(--text);
  }
  .hint{margin-top:26px; font-size:12px;}
</style>
</head>
<body>
<div class="box">
  <h1>Abriendo App del Conductor…</h1>
  <p>Si no se abre automáticamente en unos segundos, toca el botón.</p>
  <a class="btn" id="openBtn" href="#">Abrir app del conductor</a>

  <p class="hint">Si la app no se abre (por ejemplo, aún no está instalada), copia este código y pégalo manualmente en el campo "código de ruta" al abrir la app:</p>
  <code id="codeBox">—</code>
</div>
<script>
  var params = new URLSearchParams(window.location.search);
  var data = params.get('data') || '';
  var deepLink = 'conductorhca://route?data=' + data;
  document.getElementById('openBtn').href = deepLink;
  document.getElementById('codeBox').textContent = data || '(no se recibió ningún código de ruta)';
  if (data) {
    window.location.href = deepLink;
  }
</script>
</body>
</html>
